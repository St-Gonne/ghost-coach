kind = "web"
previewPath = "/"
title = "Ghost Coach"
version = "1.0.0"
id = "artifacts/ghost-coach-web"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22593

[services.development]
run = "pnpm --filter @workspace/ghost-coach-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ghost-coach-web", "run", "build" ]
publicDir = "artifacts/ghost-coach-web/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22593"
BASE_PATH = "/"
